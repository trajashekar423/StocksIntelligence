image: node:20

pipelines:
  branches:
    develop: # This triggers only when code is merged into the develop branch
      - step:
          name: Build and Deploy
          caches:
            - node
          script:
            - npm install
            - npm run build
            # Step 2: Sync files to S3
            - pipe: atlassian/aws-s3-deploy:1.1.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: 'us-east-2' # Use your specific AWS region
                S3_BUCKET: 'dev-merchant.ranevra.com'
                LOCAL_PATH: 'dist'
                DELETE_FLAG: 'true'
            # Step 3: Automatically Invalidate CloudFront Cache
            - pipe: atlassian/aws-cloudfront-invalidate:0.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: 'us-east-2'
                DISTRIBUTION_ID: $CLOUDFRONT_DISTRO_ID
                PATHS: '/*'